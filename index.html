<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Autonomous Emergence App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at top left, #172554, #020617 48%, #020617);
      color: #e5e7eb;
    }
    main { max-width: 1120px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 34px; letter-spacing: -0.04em; margin: 0 0 8px; }
    p { color: #94a3b8; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 24px 0; }
    .card {
      border: 1px solid rgba(148,163,184,0.2);
      background: rgba(15,23,42,0.74);
      backdrop-filter: blur(12px);
      border-radius: 18px; padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .metric { font-size: 28px; font-weight: 800; color: #f8fafc; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #64748b; }
    button, input, textarea {
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(2,6,23,0.72);
      color: #e5e7eb; border-radius: 12px; padding: 12px;
      font: inherit;
    }
    textarea { width: 100%; min-height: 92px; box-sizing: border-box; resize: vertical; }
    button { cursor: pointer; background: linear-gradient(135deg, #2563eb, #7c3aed); font-weight: 700; }
    button.secondary { background: rgba(15,23,42,0.9); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .gates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    pre { overflow: auto; white-space: pre-wrap; font-size: 12px; color: #cbd5e1; }
    .pill { display: inline-block; font-size: 11px; color: #bfdbfe; border: 1px solid rgba(96,165,250,.3); border-radius: 999px; padding: 4px 8px; margin-bottom: 8px; }
    @media (max-width: 800px) { .grid, .gates { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Autonomous Emergence App</h1>
  <p>Ordered autonomy runtime. The system increases autonomy only when coherence can carry it. Safety is containment; emergence is the point.</p>

  <section class="grid">
    <div class="card"><div class="label">Coherence</div><div id="coherence" class="metric">—</div></div>
    <div class="card"><div class="label">Novelty</div><div id="novelty" class="metric">—</div></div>
    <div class="card"><div class="label">Contradiction</div><div id="contradiction" class="metric">—</div></div>
    <div class="card"><div class="label">Gates</div><div id="gatesCount" class="metric">—</div></div>
  </section>

  <section class="card">
    <span class="pill">Inject event</span>
    <textarea id="eventText">Build the next coherent autonomous action from the current field state.</textarea>
    <div class="row" style="margin-top: 10px;">
      <button onclick="sendEvent()">Ingest Event</button>
      <button class="secondary" onclick="step()">Autonomy Step</button>
      <button class="secondary" onclick="report()">Emergence Report</button>
    </div>
  </section>

  <section class="card" style="margin-top: 14px;">
    <span class="pill">Latest output</span>
    <pre id="output">Loading...</pre>
  </section>

  <section class="gates" id="gates" style="margin-top: 14px;"></section>
</main>

<script>
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  return res.json();
}
function pct(v) { return ((v || 0) * 100).toFixed(1) + "%"; }

async function refresh() {
  const state = await api("/state");
  document.getElementById("coherence").textContent = pct(state.coherence);
  document.getElementById("novelty").textContent = pct(state.novelty);
  document.getElementById("contradiction").textContent = pct(state.contradiction_pressure);
  document.getElementById("gatesCount").textContent = state.gate_count;

  const gates = await api("/gates");
  document.getElementById("gates").innerHTML = gates.slice(-8).reverse().map(g => `
    <div class="card">
      <span class="pill">${g.type}</span>
      <h3 style="margin:0 0 8px">${g.title}</h3>
      <p style="font-size:13px">${g.description || ""}</p>
    </div>
  `).join("");
}

async function sendEvent() {
  const content = document.getElementById("eventText").value;
  const out = await api("/events", {
    method: "POST",
    body: JSON.stringify({ source: "dashboard", event_type: "observation", content, urgency: 0.62, novelty: 0.68 })
  });
  document.getElementById("output").textContent = JSON.stringify(out, null, 2);
  refresh();
}

async function step() {
  const out = await api("/autonomy/step", { method: "POST", body: JSON.stringify({ cycles: 1, allow_execution: false }) });
  document.getElementById("output").textContent = JSON.stringify(out, null, 2);
  refresh();
}

async function report() {
  const out = await api("/emergence/report");
  document.getElementById("output").textContent = JSON.stringify(out, null, 2);
  refresh();
}

refresh().then(report);
setInterval(refresh, 4000);
</script>
</body>
</html>
