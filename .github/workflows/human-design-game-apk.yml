name: Human Design Game APK
on:
  workflow_dispatch:
  push:
    branches: [human-design-game-apk]
    paths: ["human-design-game/**", ".github/workflows/human-design-game-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human-design-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YOU-N-I-VERSE-Human-Design-Game-APK
          path: human-design-game/app/build/outputs/apk/debug/app-debug.apk
